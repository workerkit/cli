name: Publish

# Tag-driven npm publish with provenance. Auth is npm "trusted publishing" (OIDC): configure the
# @workerkit/cli package on npmjs.com to trust this repository + this workflow file, and no npm
# token ever exists. The id-token permission below is what mints the OIDC credential.
#
# Tag a version that is NOT already published -- this fires on every v* tag, and a duplicate
# version fails the publish step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
