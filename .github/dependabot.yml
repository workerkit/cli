# Keep the exact-pinned dependency set and the workflow actions current.
# Monthly cadence and minor/patch only: three runtime deps and low churn;
# major bumps are breaking-change reviews a human schedules deliberately,
# not PRs to rubber-stamp.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
